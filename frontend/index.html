<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) — GA4 property for blog2video. The id comes from
         VITE_GA4_MEASUREMENT_ID; Vite substitutes %VITE_GA4_MEASUREMENT_ID% at
         build time, so each deploy gets its own property from its own env and
         no id is hardcoded here. Must stay immediately after <head> per
         Google's install instructions, and there must only ever be ONE GA4 tag
         on the page. src/gtag.ts loads a separate Google Ads tag at runtime;
         that's a different id and is fine alongside this one.

         Both this and the Meta Pixel block below are gated on cookie consent
         (localStorage "b2v_cookie_consent" === "accepted") — nothing here loads
         until the user accepts the ConsentBanner (src/components/ConsentBanner.tsx).
         Declining or not yet answering means neither script loads at all. -->
    <script>
      (function () {
        var consent;
        try { consent = window.localStorage.getItem("b2v_cookie_consent"); } catch (e) { consent = null; }
        if (consent !== "accepted") return;

        var id = "%VITE_GA4_MEASUREMENT_ID%";
        if (id && id.charAt(0) === "G") {
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(id);
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', id);
        }

        var pixelId = "%VITE_META_PIXEL_ID%";
        if (pixelId && pixelId.indexOf("VITE_META_PIXEL_ID") === -1) {
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
          n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
          document,'script','https://connect.facebook.net/en_US/fbevents.js');
          window.fbq('init', pixelId);
          window.fbq('track', 'PageView');
        }
      })();
    </script>

    <!-- Site ownership verification (VerifiedTools) -->
    <meta name="verifiedtools-verify" content="c819fbd2e470c99fc23c0b1182a55a472a3db575c4a1f266" />
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; connect-src 'self' https://*.blog2video.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' https://fonts.gstatic.com;" /> -->
    <title>Blog2Video</title>
    <!-- Favicons MUST be real files at crawlable URLs. Google and Bing fetch the
         icon as a separate request and cache it independently of the page, so a
         `data:` URI (what this used to be) is invisible to them — it renders in
         the browser tab but never in search results. /favicon.ico is also the
         documented fallback Google requests when it finds no usable <link>.
         Regenerate with: node scripts/build-favicons.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
