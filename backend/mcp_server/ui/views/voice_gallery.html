<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog2Video Voices</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #16161a;
        --muted: #6b6b76;
        --card: #ffffff;
        --border: #e3e3e8;
        --accent: #6d5efc;
        --chip: #f2f2f6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececf1;
          --muted: #9a9aa5;
          --card: #1c1c22;
          --border: #2e2e38;
          --chip: #26262e;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        background: transparent;
        color: var(--fg);
        font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #status { color: var(--muted); padding: 8px 2px; }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: .06em;
        text-transform: uppercase;
        margin: 14px 0 8px;
      }
      .section-label:first-child { margin-top: 0; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: border-color .12s, transform .12s;
      }
      .card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--chip);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .info { flex: 1; min-width: 0; }
      .name {
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .badges { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
      .badge {
        font-size: 10px;
        font-weight: 500;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--chip);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .badge-pro { color: #b45309; }
      .play-btn {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--chip);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 0;
      }
      .play-btn:hover { color: var(--fg); border-color: var(--accent); }
      .play-btn.playing { color: var(--accent); border-color: var(--accent); }
      .play-btn.unavailable { opacity: .35; cursor: default; }
      .play-btn.unavailable:hover { color: var(--muted); border-color: var(--border); }
    </style>
