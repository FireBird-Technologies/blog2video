<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog2Video Templates</title>
    <style>
      :root {
        color-scheme: light;
        --fg: #16161a;
        --muted: #6b6b76;
        --card: #ffffff;
        --border: #e3e3e8;
        --accent: #6d5efc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 12px;
        background: #ffffff;
        color: var(--fg);
        font: 14px/1.45 "Plus Jakarta Sans", "Inter", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      }
      #status { color: var(--muted); padding: 8px 2px; }
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
        gap: 12px;
      }
      /* "Your templates" divider — spans the whole grid row so the custom
         templates start on a fresh line rather than flowing after a card. */
      .section-label {
        grid-column: 1 / -1;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: .06em;
        text-transform: uppercase;
        margin: 6px 0 -4px;
      }
      .card {
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: border-color .12s, transform .12s;
      }
      .card:hover { transform: translateY(-2px); border-color: var(--accent); }
      .card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
      .thumb {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: var(--border);
      }
      .thumb-wrap { position: relative; }
      .template-badge {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1;
        padding: 3px 8px;
        border-radius: 999px;
        color: #fff;
        background: #7c3aed;
        font-size: 10px;
        font-weight: 700;
        line-height: 1.3;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
      }
      .template-badge.popular { background: #d97706; }
      .thumb.placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: var(--muted);
      }
      .meta { padding: 8px 10px 10px; }
      .name { font-weight: 600; }
      .genres { color: var(--muted); font-size: 12px; margin-top: 2px; }
    </style>
